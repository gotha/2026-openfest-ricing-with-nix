# Let login shells restore Nix paths after system profiles reset PATH.
set-environment -gu __ETC_PROFILE_NIX_SOURCED

# Remap prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind Space last-window

bind -n MouseDown3Pane send-keys -M MouseDown3Pane

set -g base-index 1
set -g mouse on
setw -g mode-keys vi

# Eliminate delay when processing escape sequences
set -sg escape-time 0

# Extended keys support (for kitty/modern terminals)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Pass through Shift+Enter (for VS Code/Augment terminal)
bind -n S-Enter send-keys Escape "[13;2u"

# Plugins are declared in default.nix and pinned by flake.lock.

# =============================================================================
# OSC 52 clipboard (copy over SSH and inside tmux)
# =============================================================================
# Set terminal type for proper color and feature support
set -g default-terminal "tmux-256color"

# Enable OSC 52 clipboard
set -g set-clipboard on

# Tell tmux that the outer terminal (kitty/xterm) supports these features
set -as terminal-features ',xterm-256color:clipboard'
set -as terminal-features ',xterm-kitty:clipboard'

# Allow OSC 52 to pass through tmux to the terminal
set -g allow-passthrough on

# tmux's default update-environment refreshes SSH_CONNECTION but not SSH_TTY or
# SSH_CLIENT, so a server first started over SSH leaks those two into every later
# pane forever - which makes nvim and powerlevel10k think a local session is remote.
set -ga update-environment "SSH_TTY SSH_CLIENT"

# For tmux-yank plugin: use system clipboard
set -g @yank_selection_mouse 'clipboard'
set -g @yank_selection 'clipboard'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-save-shell-history 'on'

set -g status-right ""

# basically I am trying to disable promote-window
set -g @sessionist-promote-window 'C-123'

# Home Manager installs and initializes the plugins from the locked Nixpkgs.
